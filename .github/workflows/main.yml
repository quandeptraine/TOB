name: Build CorsixTH iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CorsixTH source ZIP
        shell: bash
        run: |
          rm -rf source
          mkdir -p source
          unzip -q CorsixTH-iOS-source.zip -d source
          echo "Extracted source:"
          find source -maxdepth 2 -type f | head -50

      - name: Locate source root
        id: root
        shell: bash
        run: |
          ROOT="$(find "$GITHUB_WORKSPACE/source" -maxdepth 2 -type f -name CMakeLists.txt -print -quit | xargs -I{} dirname "{}")"
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/CMakeLists.txt" ]; then
            echo "Could not find CorsixTH CMake root."
            find "$GITHUB_WORKSPACE/source" -maxdepth 3 -name CMakeLists.txt -print
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Source root: $ROOT"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator' || true

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            ${{ steps.root.outputs.root }}/build/ios-device/vcpkg_installed
          key: vcpkg-ios-${{ runner.os }}-${{ hashFiles('CorsixTH-iOS-source.zip') }}
          restore-keys: |
            vcpkg-ios-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/vcpkg/vcpkg" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
            "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/vcpkg/vcpkg" version

      - name: Prepare clean iOS vcpkg build
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          rm -rf build/ios-device
          rm -rf "$VCPKG_ROOT/buildtrees/mp3lame"
          echo "Checking iOS manifest dependencies..."
          grep -n -A8 -B2 'fluidsynth' vcpkg.json

      - name: Configure iOS device build
        working-directory: ${{ steps.root.outputs.root }}
        run: cmake --preset ios-device

      - name: Build unsigned iOS app
        working-directory: ${{ steps.root.outputs.root }}
        run: cmake --build build/ios-device --config Release --target CorsixTH -- -quiet

      - name: Locate CorsixTH.app
        id: locate
        shell: bash
        run: |
          APP="$(find "${{ steps.root.outputs.root }}/build/ios-device" \
            -type d -path '*/Release-iphoneos/CorsixTH.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "CorsixTH.app not found."
            find "${{ steps.root.outputs.root }}/build/ios-device" -type d -name '*.app' -print
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Package unsigned IPA
        shell: bash
        env:
          APP: ${{ steps.locate.outputs.app }}
        run: |
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/CorsixTH.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/CorsixTH-iOS-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CorsixTH-iOS-unsigned-ipa
          path: CorsixTH-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
