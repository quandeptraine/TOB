name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          PROJECT=$(find . -name "GymCalorieV9.xcodeproj" -print -quit)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"
- name: Package IPA
  shell: bash
  run: |
    set -euxo pipefail

    rm -rf build/Payload
    mkdir -p build/Payload

    APP="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
      -type d \
      -name "GymCalorieV9.app" \
      -print -quit)"

    if [ -z "$APP" ]; then
      echo "ERROR: Không tìm thấy GymCalorieV9.app"
      find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
        -maxdepth 3 -print || true
      exit 1
    fi

    echo "FOUND APP:"
    echo "$APP"

    cp -R "$APP" build/Payload/GymCalorieV9.app

    cd build
    zip -qry GymCalorieV9-unsigned.ipa Payload

    echo "IPA CREATED:"
    ls -lh GymCalorieV9-unsigned.ipa
          cp -R build/DerivedData/Build/Products/Release-iphoneos/GymCalorieV9.app build/Payload/
          cd build
          zip -qry GymCalorieV9-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GymCalorieV9-unsigned-ipa
          path: build/GymCalorieV9-unsigned.ipa
