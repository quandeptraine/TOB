name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned
        run: |
          xcodebuild -project GymCalorieV9.xcodeproj -scheme GymCalorieV9 -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/GymCalorieV9.app build/Payload/
          cd build && zip -qry GymCalorieV9-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GymCalorieV9-unsigned-ipa
          path: build/GymCalorieV9-unsigned.ipa
